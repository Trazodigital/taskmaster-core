# Product CI: run the Quality Framework gates on every push / PR.
# Installed into a product by scripts/init-product.sh at
# .github/workflows/quality-gates.yml.
name: quality-gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with the framework submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          # full history so PR base..head is resolvable for the commit-range gate
          fetch-depth: 0

      # The verifiers accept `yq` OR `python3` + PyYAML. `yq` is chosen here on
      # purpose: it is a single static binary that installs next to the product
      # and joins nothing. PyYAML is an interpreted package that enters the
      # product's own dependency graph and has to be reconciled with it — a real
      # cost when the product is itself Python with pinned versions. The
      # framework should add no overhead to a product it knows nothing about.
      # GitHub's ubuntu images normally ship `yq`, so the download is a fallback
      # that usually does not run. Version is pinned; bump it deliberately.
      - name: Ensure a YAML parser is available
        run: |
          if command -v yq >/dev/null 2>&1; then
            echo "yq already present: $(yq --version)"
            exit 0
          fi
          YQ_VERSION=v4.44.3
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # QF_BRANCH is passed because a CI checkout is a detached merge commit:
      # `git rev-parse --abbrev-ref HEAD` reports `HEAD`, not the branch being
      # merged. The wrapper needs the real name to tell the two tracks apart —
      # an `arch/<slug>` head runs the architecture suite set, everything else
      # runs the full set.
      #
      # The branch name is chosen by whoever opened the PR, and on a fork that
      # is fully attacker-controlled. It is therefore NOT a trust signal, and
      # `arch/*` alone does not buy a reduced gate set: QF_BASE_SHA lets the
      # wrapper hard-gate an architecture branch that touches `src/` or
      # `tests/`, which is the property that makes the reduced set sound. A PR
      # author can pick the track; they cannot pick it AND ship code under it.
      #
      # Both values go through `env:`, never interpolated into the `run:` script
      # — `github.head_ref` in a shell line is a command-injection vector.
      - name: Run Quality Framework gates
        env:
          QF_BRANCH: ${{ github.head_ref || github.ref_name }}
          QF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/local_dry_CI_run_before_commit.sh

      # Branch-name + commit-message gates, PR-aware. In CI the checked-out ref
      # is a detached merge commit, so these run off the PR's real head branch
      # and its actual commit range (base..head) rather than the detached HEAD.
      - name: Convention gates (pull requests)
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          QF_ROOT="$PWD" .framework/scripts/check-branch-name.sh --branch "$HEAD_REF"
          QF_ROOT="$PWD" .framework/scripts/check-commit-range.sh --range "$BASE_SHA..$HEAD_SHA"
          # A .framework bump inside this PR must be accounted for in
          # FRAMEWORK_FEEDBACK.md — findings, or an explicit "No findings".
          QF_ROOT="$PWD" .framework/scripts/check-framework-feedback.sh --range "$BASE_SHA..$HEAD_SHA"

      # Does branch_protection describe reality? Runs here rather than in the
      # local dry run: it calls the host's API, and CI is where the credential
      # lives. A product declaring `enforcement.mechanism: manual-process`
      # passes as DEGRADED without any network call.
      - name: Branch-protection enforcement gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: QF_ROOT="$PWD" .framework/scripts/check-branch-protection.sh

      # Architecture-first backstop: a feature/bugfix PR must not exist before
      # the architecture layer does. Agent-time this is a workflows/sdd-new.md
      # precondition; this step catches a bypassed agent or a hand-authored PR.
      # Scoped to feature/bugfix branches so arch/* bootstrap PRs (which create
      # the architecture) are not blocked by their own precondition.
      - name: Architecture-exists gate (feature / bugfix PRs)
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'bugfix/'))
        run: QF_ROOT="$PWD" .framework/scripts/check-architecture-exists.sh

      # Non-blocking: publish the requirement traceability matrix
      # (Implemented / Verified / Accepted / Released) to the run summary.
      # The summary answers "is this covered?" and stays readable inline.
      - name: Traceability report (summary)
        if: always()
        run: QF_ROOT="$PWD" .framework/scripts/check-traceability.sh --report >> "$GITHUB_STEP_SUMMARY"

      # The detail answers "covered by what?" — every source and test marker
      # with its file:line. Too wide for the run summary, so it ships as an
      # artifact in both renderings: Markdown to read, JSON for tooling.
      - name: Traceability report (detail)
        if: always()
        run: |
          QF_ROOT="$PWD" .framework/scripts/check-traceability.sh --report --detail \
            --report-out reports/traceability/traceability-detail.md
          QF_ROOT="$PWD" .framework/scripts/check-traceability.sh --report --detail \
            --format json --report-out reports/traceability/traceability-detail.json

      - name: Upload the traceability detail report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability-detail
          path: reports/traceability/
          if-no-files-found: warn
