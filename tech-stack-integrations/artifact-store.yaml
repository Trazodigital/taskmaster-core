# artifact-store.yaml — Interaction contract for the artifact store
#
# Describes HOW the framework interacts with whatever backend stores CI-produced
# evidence artifacts (Azure Pipeline Artifacts, GitHub Actions Artifacts, S3,
# JFrog Artifactory, Nexus, …). Skills read this file to publish artifacts,
# render links in PR comments, and fetch historical benchmark baselines.
#
# TEMPLATE FILE. Every <PLACEHOLDER> value MUST be replaced with a concrete
# choice before any framework skill is invoked. Skills MUST hard-gate on any
# remaining <PLACEHOLDER> value.
#
# OWNERSHIP: human-owned. The agent MUST read this file but MUST NOT create,
# modify, rename, or delete it. See AGENTS.md § "Ownership boundaries".

# ─── 1. Tool identity ─────────────────────────────────────────────────────────

tool:
  name: "github-actions-artifacts"              # e.g. azure-pipeline-artifacts, github-actions-artifacts, s3, jfrog-artifactory, nexus
  interaction_mode: "ci-native"  # rest-api | cli | ci-native

# ─── 2. Authentication ────────────────────────────────────────────────────────

auth:
  mode: "none"              # none | token | oauth | basic
  credential_key: "none"    # path in the secrets vault (see secrets-vault.yaml)

# ─── 3. URL construction ──────────────────────────────────────────────────────

url:
  base_url: "https://github.com/user/taskmaster-core/actions"          # e.g. https://dev.azure.com/acme/orders-api/_build/results
  url_template: "{base_url}?buildId={build_id}&view=artifacts"      # e.g. "{base_url}?buildId={build_id}&view=artifacts&artifactName={artifact_class}"

# ─── 4. Retention policies ────────────────────────────────────────────────────

retention_policies:
  "30d":         "delete after 30 days"     # e.g. "delete after 30 days"
  "per-release": "retain while release tag references build"     # e.g. "retain while any release tag references the build"
  "historical":  "retain indefinitely"     # e.g. "retain indefinitely, one snapshot per release tag"

# ─── 5. Commands ──────────────────────────────────────────────────────────────

commands:
  publish:          "echo Publishing {artifact_class} to {path}"  # e.g. "az artifacts universal publish..."
  fetch_historical: "echo Fetching historical {artifact_class} to {dest}"  # e.g. "az artifacts universal download..."

# ─── 6. Gate policy ───────────────────────────────────────────────────────────

gate:
  on_publish_failure: hard-gate            # publish command exited non-zero
  on_missing_artifact: hard-gate           # a suite declared an artifact class but nothing was published
  on_broken_url: hard-gate                 # url_template renders to an unreachable URL
  on_retention_policy_missing: hard-gate   # a retention label referenced in build-pipeline.yaml has no entry here
