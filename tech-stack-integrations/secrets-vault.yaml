# secrets-vault.yaml — Interaction contract for the secrets vault
#
# Describes HOW the framework interacts with whatever backend holds runtime
# credentials (Azure Key Vault, HashiCorp Vault, AWS Secrets Manager, GCP
# Secret Manager, Doppler, 1Password, …). Skills read this file to validate
# credential_key paths in other integration files, fetch secrets at runtime
# and in CI, and scan source code for hardcoded secrets.
#
# Every other integration file references this file via its own
# `auth.credential_key` field. That path MUST match `naming.path_pattern`
# declared below.
#
# TEMPLATE FILE. Every <PLACEHOLDER> value MUST be replaced with a concrete
# choice before any framework skill is invoked. Skills MUST hard-gate on any
# remaining <PLACEHOLDER> value.
#
# OWNERSHIP: human-owned. The agent MUST read this file but MUST NOT create,
# modify, rename, or delete it. See AGENTS.md § "Ownership boundaries".

# ─── 1. Tool identity ─────────────────────────────────────────────────────────

tool:
  name: <PLACEHOLDER>              # e.g. azure-key-vault, hashicorp-vault, aws-secrets-manager, gcp-secret-manager, doppler, 1password
  interaction_mode: <PLACEHOLDER>  # rest-api | cli | sdk

# ─── 2. Authentication ────────────────────────────────────────────────────────
#
# The vault itself needs credentials to be read. Runtime (app in production)
# and CI (pipeline) usually authenticate differently.

auth:
  runtime_mode: <PLACEHOLDER>      # workload-identity | managed-identity | service-account | token
  ci_mode: <PLACEHOLDER>           # oidc | service-principal | token

# ─── 3. Naming convention ─────────────────────────────────────────────────────
#
# Every `auth.credential_key` value in every other integration file MUST match
# `path_pattern`. Skills hard-gate on mismatches, so a single regex here
# governs the entire framework's secret-path discipline.

naming:
  path_pattern: <PLACEHOLDER>      # regex, e.g. "^kv/[a-z0-9-]+/[a-z0-9-]+$"
  scope_prefix: <PLACEHOLDER>      # per-project prefix, e.g. "kv/orders-api/"

# ─── 4. Commands ──────────────────────────────────────────────────────────────
#
# Concrete invocations for runtime fetch, CI fetch, and source scan. Skills
# invoke these verbatim. The `scan_source` value here MUST be the same string
# used in build-pipeline.yaml § suites.security-scan.command.

commands:
  fetch_runtime:  <PLACEHOLDER>    # e.g. az keyvault secret show --vault-name {vault} --name {key} --query value -o tsv
  fetch_ci:       <PLACEHOLDER>    # e.g. task: AzureKeyVault@2 (referenced from CI YAML), or a CLI equivalent
  scan_source:    <PLACEHOLDER>    # e.g. trufflehog filesystem . --json --fail

# ─── 5. Gate policy ───────────────────────────────────────────────────────────
#
# Every violation MUST hard-gate: the agent reports the exact violation, stops,
# and waits for a human. No warn-and-continue.

gate:
  on_hardcoded_secret: hard-gate                 # scan_source found a secret literal in source
  on_credential_key_pattern_mismatch: hard-gate  # a credential_key in another integration file doesn't match naming.path_pattern
  on_missing_env_declaration: hard-gate          # runtime code fetches a secret not listed in .env.example
  on_fetch_failure: hard-gate                    # fetch_runtime or fetch_ci exited non-zero
