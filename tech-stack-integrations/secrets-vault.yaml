# secrets-vault.yaml — Interaction contract for the secrets vault
#
# Describes HOW the framework interacts with whatever backend holds runtime
# credentials (Azure Key Vault, HashiCorp Vault, AWS Secrets Manager, GCP
# Secret Manager, Doppler, 1Password, …). Skills read this file to validate
# credential_key paths in other integration files, fetch secrets at runtime
# and in CI, and scan source code for hardcoded secrets.
#
# TEMPLATE FILE. Every <PLACEHOLDER> value MUST be replaced with a concrete
# choice before any framework skill is invoked. Skills MUST hard-gate on any
# remaining <PLACEHOLDER> value.
#
# OWNERSHIP: human-owned. The agent MUST read this file but MUST NOT create,
# modify, rename, or delete it. See AGENTS.md § "Ownership boundaries".

# ─── 1. Tool identity ─────────────────────────────────────────────────────────

tool:
  name: "env-vars"              # e.g. azure-key-vault, hashicorp-vault, aws-secrets-manager, gcp-secret-manager, doppler, 1password
  interaction_mode: "cli"  # rest-api | cli | sdk

# ─── 2. Authentication ────────────────────────────────────────────────────────

auth:
  runtime_mode: "token"      # workload-identity | managed-identity | service-account | token
  ci_mode: "token"           # oidc | service-principal | token

# ─── 3. Naming convention ─────────────────────────────────────────────────────

naming:
  path_pattern: "^kv/[a-z0-9-]+/[a-z0-9-]+$"      # regex, e.g. "^kv/[a-z0-9-]+/[a-z0-9-]+$"
  scope_prefix: "kv/taskmaster/"      # per-project prefix, e.g. "kv/orders-api/"

# ─── 4. Commands ──────────────────────────────────────────────────────────────

commands:
  fetch_runtime:  "echo {key}"    # e.g. az keyvault secret show...
  fetch_ci:       "echo {key}"    # e.g. task: AzureKeyVault@2
  # MUST stay byte-identical to build-pipeline.yaml § suites.security-scan.command:
  # verification-suite-execution hard-gates on the scanner-identity invariant.
  scan_source:    "mkdir -p reports/security && bandit -r src/ -f sarif -o reports/security/bandit.sarif"    # e.g. trufflehog filesystem . --json --fail

# ─── 5. Gate policy ───────────────────────────────────────────────────────────

gate:
  on_hardcoded_secret: hard-gate                 # scan_source found a secret literal in source
  on_credential_key_pattern_mismatch: hard-gate  # a credential_key in another integration file doesn't match naming.path_pattern
  on_missing_env_declaration: hard-gate          # runtime code fetches a secret not listed in .env.example
  on_fetch_failure: hard-gate                    # fetch_runtime or fetch_ci exited non-zero
