# requirements-tracker.yaml — Interaction contract for the requirements tracker
#
# Describes HOW the framework interacts with whatever tool stores requirements
# (plain markdown files, DOORS Next, Jira with a REQ plugin, etc.). Skills read
# this file to resolve tool-specific commands, marker placement, and gate
# behavior.
#
# The gate scripts parse `markdown` only — see `storage.format`. That is a
# deliberate choice, not an oversight: a heavier tracker would impose its own
# runtime on every product regardless of the product's language (CHANGELOG,
# "Requirements storage stays markdown — StrictDoc rejected"). Declaring a
# format the scripts cannot parse is an error, never a silent pass.
#
# TEMPLATE FILE. Every <PLACEHOLDER> value MUST be replaced with a concrete
# choice before any framework skill is invoked. Skills MUST hard-gate on any
# remaining <PLACEHOLDER> value.
#
# OWNERSHIP: human-owned. The agent MUST read this file but MUST NOT create,
# modify, rename, or delete it. See AGENTS.md § "Ownership boundaries".

# ─── 1. Tool identity ─────────────────────────────────────────────────────────

tool:
  name: markdown-files             # markdown-files (supported today) | doors-next | jira-req
  interaction_mode: "local-files"  # local-files | cli | rest-api | webhook

# ─── 2. Authentication ────────────────────────────────────────────────────────
#
# Only used when interaction_mode is rest-api or webhook. Leave placeholders
# in place when interaction_mode is local-files or cli — skills MUST skip
# auth resolution in that case.

auth:
  mode: "none"              # none | token | oauth | basic
  credential_key: "none"    # path in the secrets vault (see secrets-vault.yaml)

# ─── 3. Storage layout ────────────────────────────────────────────────────────

storage:
  requirements_dir: docs/requirements     # framework-fixed
  format: markdown                        # the only format the gate scripts parse
  file_extension: md                      # corpus glob; must match `format`
  one_file_per: feature                   # feature | requirement | project
  glossary_file: docs/glossary.md         # framework-fixed

# `one_file_per: feature` groups related requirements into one file and is the
# recommended default — the framework generates one requirement per diagram
# node/edge/subgraph (see `mermaid-intake`), so `requirement` turns a single
# architecture diagram into dozens of flat files. All three values are checked
# per requirement, not per file.

# ─── 4. UID convention ────────────────────────────────────────────────────────

uid:
  # Framework-fixed; inherited from tech-stack.yaml. The `(-[A-Z]+)*` group
  # exists because the shipped types below include hyphenated names: without it
  # `REQ-NFR-PERF-001` matches nothing, and every gate that resolves UIDs from
  # this pattern goes blind to the entire NFR corpus.
  pattern: "REQ-[A-Z]+(-[A-Z]+)*-[0-9]+"
  types:                                  # extendable per project; written WITHOUT the `REQ-` prefix
    - ARCH
    - FUNC
    - NFR-PERF
    - NFR-SEC
    - NFR-USE
  uniqueness_check: scripts/check-uid-uniqueness.sh   # framework-fixed

# ─── 5. Traceability markers ──────────────────────────────────────────────────

markers:
  # Framework-fixed and tool-neutral. `@sdoc` is this framework's marker string,
  # not a dependency on any requirements tool; it works unchanged over markdown.
  syntax: "@sdoc[<UID>]"
  comment_style: "python-docstring"            # jsdoc | python-docstring | godoc | rustdoc
  scan_paths:                             # framework-fixed
    - src
    - tests
  ignore_paths:
    - node_modules
    - dist
    - build
    - .venv
    - target

# ─── 5b. Requirement relations ────────────────────────────────────────────────
#
# `refines` is the only relation type: a child requirement is a more specific
# statement of its parent. It mirrors decomposition (architecture → functional →
# NFR) and answers the two questions a flat corpus cannot — "why does this
# requirement exist?" (walk up) and "what breaks if I change it?" (walk down).
# `depends_on` and `conflicts_with` were deliberately left out: they describe
# ordering and review concerns, form no tree, and answer neither question.
#
# Authoring: one column-0 field per requirement, comma-separated for several
# parents.
#
#     UID: REQ-FUNC-012
#
#     REFINES: REQ-ARCH-005, REQ-ARCH-009
#
# `check-relations.sh` validates that every named parent exists, that nothing
# refines itself, and that the graph is acyclic — always. Those three run
# against whatever is written.

relations:
  refines:
    roots: [ARCH]              # types that legitimately have no parent
    # Types that MUST declare a parent. Ships empty on purpose: turning this on
    # before the corpus is annotated hard-gates a team on every requirement at
    # once, which is how a good gate gets switched off. Populate the graph
    # first, then enable.
    required_for_types: []

# ─── 6. Commands ──────────────────────────────────────────────────────────────
#
# Concrete invocations per capability. Skills invoke these verbatim.
# Values under scripts/ are framework-fixed and MUST NOT be changed.

commands:
  validate_corpus: "scripts/check-traceability.sh --phase spec"          # corpus well-formedness; exits 0 when valid
  export_matrix: scripts/check-traceability.sh --report
  check_uniqueness: scripts/check-uid-uniqueness.sh
  check_glossary: scripts/check-glossary.sh
  check_nfr_fields: scripts/check-nfr-fields.sh
  check_traceability: scripts/check-traceability.sh

# ─── 7. NFR field schema ──────────────────────────────────────────────────────

nfr_fields:
  required_for_types:
    - NFR-PERF
    - NFR-SEC
    - NFR-USE
  fields:
    - METRIC
    - THRESHOLD
    - MEASUREMENT_METHOD

# ─── 8. Gate policy ───────────────────────────────────────────────────────────
#
# Every violation MUST hard-gate: the agent reports the exact violation, stops,
# and waits for a human. No warn-and-continue.

gate:
  on_orphan_marker: hard-gate
  on_missing_marker: hard-gate
  on_duplicate_uid: hard-gate
  on_missing_nfr_field: hard-gate
  on_undefined_glossary_term: hard-gate
