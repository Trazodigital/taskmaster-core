# observability-platform.yaml — Interaction contract for the observability platform
#
# Describes HOW the framework interacts with whatever backend receives runtime
# telemetry and holds alert / dashboard / health-check definitions (Datadog,
# Azure Monitor / Application Insights, Grafana Cloud, Honeycomb, New Relic,
# Prometheus+Loki+Tempo, …). Skills read this file to validate log format,
# deploy definitions, and enforce NFR observability.
#
# TEMPLATE FILE. Every <PLACEHOLDER> value MUST be replaced with a concrete
# choice before any framework skill is invoked. Skills MUST hard-gate on any
# remaining <PLACEHOLDER> value.
#
# OWNERSHIP: human-owned. The agent MUST read this file but MUST NOT create,
# modify, rename, or delete it. See AGENTS.md § "Ownership boundaries".

# ─── 1. Tool identity ─────────────────────────────────────────────────────────

tool:
  name: "console-logger"              # e.g. datadog, azure-monitor, grafana-cloud, honeycomb, new-relic, prometheus-loki-tempo
  interaction_mode: "cli"  # rest-api | cli | sdk

# ─── 2. Authentication ────────────────────────────────────────────────────────

auth:
  runtime_mode: "token"           # workload-identity | api-key | token
  runtime_credential_key: "kv/taskmaster/logger-token" # path in the secrets vault (see secrets-vault.yaml)
  ci_mode: "token"                # oidc | service-principal | token
  ci_credential_key: "kv/taskmaster/logger-token"      # path in the secrets vault (see secrets-vault.yaml)

# ─── 3. Log format (framework-fixed) ──────────────────────────────────────────

log_format:
  event_types: [start, end, error]
  required_fields:
    - timestamp
    - level
    - event_type            # MUST be one of event_types
    - feature               # feature identifier
    - req_uid               # REQ this event proves (matches uid.pattern in requirements-tracker.yaml)
    - correlation_id        # request / trace identifier
    - message

# ─── 4. Deployment sources (framework-fixed) ──────────────────────────────────

deployment_sources:
  alerts:        runtime-observability/alerts/
  dashboards:    runtime-observability/dashboards/
  health_checks: runtime-observability/health-checks/

# ─── 5. Commands ──────────────────────────────────────────────────────────────

commands:
  deploy_alerts:        "echo Deploying alerts from {source}"  # e.g. "datadog-ci alert publish --path {source}"
  deploy_dashboards:    "echo Deploying dashboards from {source}"  # e.g. "datadog-ci dashboard publish --path {source}"
  deploy_health_checks: "echo Deploying health checks from {source}"  # e.g. "datadog-ci synthetics run-tests --config {source}"

# ─── 6. Gate policy ───────────────────────────────────────────────────────────

gate:
  on_missing_log_field: hard-gate         # a log event omits a required_fields entry
  on_undeclared_event_type: hard-gate     # event_type value not in log_format.event_types
  on_deploy_failure: hard-gate            # a deploy_* command exited non-zero
  on_missing_alert_definition: hard-gate  # an NFR-* requirement has no alert file that links to its req_uid
