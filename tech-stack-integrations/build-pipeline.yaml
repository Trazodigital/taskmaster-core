# build-pipeline.yaml — Interaction contract for the build & release pipeline
#
# Describes HOW the framework interacts with whatever system builds, tests, and
# releases the project (GitHub Actions, GitLab CI, Azure DevOps Pipelines,
# Jenkins, Buildkite, …). Skills read this file to resolve suite commands,
# artifact publishing paths, and branch protection rules.
#
# TEMPLATE FILE. Every <PLACEHOLDER> value MUST be replaced with a concrete
# choice before any framework skill is invoked. Skills MUST hard-gate on any
# remaining <PLACEHOLDER> value.
#
# OWNERSHIP: human-owned. The agent MUST read this file but MUST NOT create,
# modify, rename, or delete it. See AGENTS.md § "Ownership boundaries".

# ─── 1. Tool identity ─────────────────────────────────────────────────────────

tool:
  name: "github-actions"              # e.g. github-actions, gitlab-ci, azure-devops-pipelines
  interaction_mode: "hosted-yaml"  # hosted-yaml | cli | rest-api

# ─── 2. Authentication ────────────────────────────────────────────────────────
#
# Only used when the agent needs to trigger pipelines or read status via API.
# Leave placeholders in place when interaction_mode is hosted-yaml.

auth:
  mode: "none"              # none | token | oauth | basic
  credential_key: "none"    # path in the secrets vault (see secrets-vault.yaml)

# ─── 3. Suites ────────────────────────────────────────────────────────────────
#
# Each suite declares the command to run, whether it blocks merge, the events
# that trigger it, and the artifacts it produces. Commands referencing
# .framework/scripts/*.sh are framework-fixed (run with QF_ROOT set to the repo
# root — the gate scripts live inside the submodule). Valid triggers:
# push | pr | tag | release-branch | schedule | manual
#
# PRODUCT-DEFINED SUITES. A product may add its own gates under a `product-`
# prefix, with any command it likes:
#
#   product-openapi-coverage:
#     command: <your own command>      # any script or tool YOUR product ships
#     triggers: [push, pr]
#     blocking: true
#     artifacts: []
#
# The prefix is required. Without a namespace, a product gate could take a bare
# name that a later framework release also uses, silently changing what that
# name means — and the only alternative was smuggling the check in under an
# existing name like `lint`, which makes this file describe something it is not
# running. Framework-fixed suites stay locked: their commands cannot be
# repointed, so a gate can never be quietly weakened.

suites:

  lint:
    command: "mkdir -p reports/lint && flake8 src/ --tee --output-file=reports/lint/flake8.txt"                       # resolves toolchain.linter from tech-stack.yaml
    triggers: [push, pr]
    blocking: true
    artifacts: [lint-report]

  format-check:
    command: "black --check src/"                       # resolves toolchain.formatter --check
    triggers: [push, pr]
    blocking: true
    artifacts: []

  type-check:
    command: "python3 -m compileall -q src/"                       # e.g. tsc --noEmit, mypy, go vet
    triggers: [push, pr]
    blocking: true
    artifacts: []

  test-unit:
    command: "mkdir -p reports/junit reports/coverage && pytest tests/ src/ --junitxml=reports/junit/junit.xml --cov=src --cov-report=xml:reports/coverage/coverage.xml --cov-report=term"                       # resolves toolchain.test_runner unit subset
    triggers: [push, pr]
    blocking: true
    artifacts: [junit-xml, coverage]

  test-integration:
    command: "mkdir -p reports/junit && pytest tests/ src/ --junitxml=reports/junit/integration.xml"                       # resolves toolchain.test_runner integration subset
    triggers: [push, pr]
    blocking: true
    artifacts: [junit-xml]

  test-security:
    command: "mkdir -p reports/security && bandit -r src/ -f sarif -o reports/security/bandit.sarif"                       # resolves toolchain.test_runner security subset
    triggers: [push, pr]
    blocking: true
    artifacts: [junit-xml]

  security-scan:
    command: "mkdir -p reports/security && bandit -r src/ -f sarif -o reports/security/bandit.sarif"                       # resolves toolchain.security_scanner
    triggers: [push, pr]
    blocking: true
    artifacts: [sarif]

  test-e2e:
    command: "pytest tests/"                       # E2E runner against staging
    triggers: [tag, release-branch]
    blocking: true
    artifacts: [junit-xml, e2e-video]

  bench:
    command: "mkdir -p reports/bench && pytest --benchmark-only --benchmark-json=reports/bench/benchmark.json"                       # resolves toolchain.benchmark_tool
    triggers: [tag, release-branch]
    blocking: true
    artifacts: [benchmark-report, heap-snapshot]

  traceability-gate:
    command: .framework/scripts/check-traceability.sh --phase verify --check-logging   # QF_ROOT env var must be set to the repo root
    triggers: [push, pr]
    blocking: true
    artifacts: [traceability-matrix]

  traceability-gate-arch:
    command: .framework/scripts/check-traceability.sh --phase verify --architecture-only   # QF_ROOT env var must be set to the repo root
    triggers: [push, pr]
    blocking: true
    artifacts: [traceability-matrix]

  docs-overview-gate:
    command: .framework/scripts/check-traceability.sh --report --overview --check   # QF_ROOT env var must be set to the repo root
    triggers: [push, pr]
    blocking: true
    artifacts: []

  glossary-gate:
    command: .framework/scripts/check-glossary.sh   # QF_ROOT env var must be set to the repo root
    triggers: [push, pr]
    blocking: true
    artifacts: []

  docs-layout-gate:
    command: .framework/scripts/check-docs-layout.sh   # QF_ROOT env var must be set to the repo root
    triggers: [push, pr]
    blocking: true
    artifacts: []

  integration-consistency-gate:
    command: .framework/scripts/check-integration-consistency.sh   # QF_ROOT env var must be set to the repo root
    triggers: [push, pr]
    blocking: true
    artifacts: []

  uid-uniqueness-gate:
    command: .framework/scripts/check-uid-uniqueness.sh   # QF_ROOT env var must be set to the repo root
    triggers: [push, pr]
    blocking: true
    artifacts: []

  relations-gate:
    command: .framework/scripts/check-relations.sh   # QF_ROOT env var must be set to the repo root
    triggers: [push, pr]
    blocking: true
    artifacts: []

  framework-feedback-gate:
    command: .framework/scripts/check-framework-feedback.sh   # QF_ROOT env var must be set to the repo root
    triggers: [push, pr]
    blocking: true
    artifacts: []

  branch-protection-gate:
    command: .framework/scripts/check-branch-protection.sh   # QF_ROOT env var must be set to the repo root
    triggers: [push, pr]
    blocking: true
    artifacts: []

  nfr-fields-gate:
    command: .framework/scripts/check-nfr-fields.sh   # QF_ROOT env var must be set to the repo root
    triggers: [push, pr]
    blocking: true
    artifacts: []

  design-review-gate:
    command: .framework/scripts/check-design-review.sh   # QF_ROOT env var must be set to the repo root
    triggers: [push, pr]
    blocking: true
    artifacts: []

  design-review-gate-arch:
    command: .framework/scripts/check-design-review.sh --scope architecture   # QF_ROOT env var must be set to the repo root
    triggers: [push, pr]
    blocking: true
    artifacts: []

  module-structure-gate:
    command: .framework/scripts/check-module-structure.sh   # QF_ROOT env var must be set to the repo root
    triggers: [push, pr]
    blocking: true
    artifacts: []

  docs-build:
    command: "mkdir -p reports/docs && cp -R docs/. reports/docs/"                       # e.g. mkdocs build --strict, strictdoc export
    triggers: [push, pr]
    blocking: true
    artifacts: [docs-site]

  schema-validation:
    command: "python3 -c 'print(\"Validating schema\")'"   # validates tech-stack.yaml + tech-stack-integrations/*.yaml
    triggers: [push, pr]
    blocking: true
    artifacts: []

# ─── 3b. Architecture-track suites ────────────────────────────────────────────
#
# The framework runs two tracks. A feature/bugfix branch carries implementation
# and is held to every suite above. An `arch/<slug>` branch authors the
# requirements corpus and carries NO implementation — that is not an omission,
# it is what workflows/sdd-architecture.md prescribes ("architecture-only — no
# feature code, no feature tests").
#
# So the code-shaped suites cannot pass there, and holding an architecture PR to
# them would make a CORRECT architecture PR structurally unmergeable. This list
# names the subset that runs on an architecture branch. Every entry MUST also be
# a key under `suites` above — the list selects existing suites, it never
# defines new ones or new commands.
#
# This is a NARROWING, not a bypass. Each suite named here runs in full and
# hard-gates exactly as it does on a feature branch; `traceability-gate-arch`
# still fails on orphan markers, and still reports the true uncovered counts
# alongside `"architecture_only": true`. What changes is which suites apply,
# and that is decided by the branch — not by the person running the command.

architecture_suites:
  - traceability-gate-arch
  - docs-overview-gate
  - glossary-gate
  - nfr-fields-gate
  - design-review-gate-arch
  - uid-uniqueness-gate
  - relations-gate
  - docs-layout-gate
  - integration-consistency-gate
  - framework-feedback-gate
  - schema-validation

# ─── 4. Artifacts ─────────────────────────────────────────────────────────────
#
# Declares each artifact class produced by suites, its published location, and
# retention. The concrete artifact store is described in
# tech-stack-integrations/artifact-store.yaml.

artifacts:
  lint-report:         { path: reports/lint/,          retention: 30d }
  junit-xml:           { path: reports/junit/,         retention: per-release }
  coverage:            { path: reports/coverage/,      retention: per-release }
  sarif:               { path: reports/security/,      retention: per-release }
  benchmark-report:    { path: reports/bench/,         retention: historical }
  heap-snapshot:       { path: reports/heap/,          retention: per-release }
  e2e-video:           { path: reports/e2e/,           retention: 30d }
  traceability-matrix: { path: reports/traceability/,  retention: per-release }
  docs-site:           { path: reports/docs/,          retention: per-release }

# ─── 5. Branch protection ─────────────────────────────────────────────────────
#
# Two different things live here, and conflating them produces a config file
# that states a falsehood:
#
#   POLICY      — what this project requires. The fields below. Framework-fixed.
#   ENFORCEMENT — what actually stops a bad merge. The `enforcement` block.
#
# The policy fields are locked to their strict values on purpose: the framework
# requires reviewed, linear, non-force-pushed history, and there is no
# supported way to declare otherwise. But requiring something is not the same
# as being able to enforce it. A private repository on a GitHub plan without
# branch protection returns 403 from the protection API, and a CODEOWNERS file
# on its own only auto-requests a reviewer — it blocks nothing.
#
# Declare the truth in `enforcement`. A project that cannot enforce the policy
# server-side is a supported state; a config that silently claims an enforced
# gate that does not exist is not.

branch_protection:
  protected_branches: [main]
  required_checks:                                 # all blocking suites triggered on push/pr
    - lint
    - format-check
    - type-check
    - test-unit
    - test-integration
    - test-security
    - security-scan
    - traceability-gate
    - traceability-gate-arch
    - docs-overview-gate
    - glossary-gate
    - docs-layout-gate
    - integration-consistency-gate
    - uid-uniqueness-gate
    - relations-gate
    - framework-feedback-gate
    - branch-protection-gate
    - nfr-fields-gate
    - design-review-gate
    - design-review-gate-arch
    - module-structure-gate
    - docs-build
    - schema-validation
  min_reviewers: 1                                 # four-eyes principle
  require_codeowners_review: true
  require_linear_history: true
  allow_force_push: false
  allow_deletion: false

  # Where the policy above is actually enforced.
  #
  #   host-native     the hosting platform enforces it server-side. `verified_by`
  #                   MUST be set; check-branch-protection.sh runs it and
  #                   hard-gates when live protection does not match the policy.
  #   manual-process  humans enforce it by agreement. The gate reports a
  #                   DEGRADED state and passes — honest, not silent.
  #   none            nothing enforces it. Same reporting, no pretence.
  #
  # `unenforceable_reason` is REQUIRED unless mechanism is host-native. Write
  # the real reason ("private repo on GitHub Free — protection API returns
  # 403"), not a placeholder sentence.
  enforcement:
    mechanism: "manual-process"             # host-native | manual-process | none
    verified_by: ""           # required for host-native; exits 0 when live protection matches
                                         # e.g. gh api "repos/{owner}/{repo}/branches/main/protection" >/dev/null
    unenforceable_reason: "Single available maintainer. The repository declares 1 approving review with CODEOWNERS on main, but GitHub does not allow a PR author to approve their own PR, and the only other owner is not available to review. enforce_admins was set to false on 2026-08-16 so the sole maintainer can land work, and CODEOWNERS now lists that maintainer alone; the review requirement itself is left declared, not deleted, so restoring four-eyes is one flag plus one line. Every admin bypass is recorded by GitHub. Separately, no required status checks are configured: the quality-gates workflow publishes ONE check, so the suite names in required_checks cannot map to GitHub status checks as declared; they are enforced inside that job by scripts/local_dry_CI_run_before_commit.sh."  # required unless host-native

# ─── 6. Merge policy ──────────────────────────────────────────────────────────

merge_policy:
  strategy: "squash"          # merge-commit | squash | rebase
  require_pr_checklist: true       # PR template must be fully completed

# ─── 7. Deployment gates ──────────────────────────────────────────────────────
#
# Phase 5's system-acceptance-gate is expressed here as a sequence of gates
# that MUST pass before promotion. Skills MUST NOT bypass any step.

deployment:
  staging:
    trigger: "push-to-main"         # e.g. push-to-main, tag, manual
    requires_suites: [test-e2e, bench]
  production:
    trigger: "tag"         # e.g. tag, manual, po-approval
    requires_gates:
      - nfr-threshold-check        # compares bench output against NFR thresholds
      - po-acceptance              # explicit approval recorded in PR / issue

# ─── 8. Gate policy ───────────────────────────────────────────────────────────
#
# Every violation MUST hard-gate: the agent reports the exact violation, stops,
# and waits for a human. No warn-and-continue.

gate:
  on_suite_failure: hard-gate
  on_missing_artifact: hard-gate
  on_branch_protection_bypass: hard-gate
  on_missing_review: hard-gate
  on_nfr_regression: hard-gate
  on_missing_po_approval: hard-gate
